# 卡尔曼滤波
ekf_filter_node:
  ros__parameters:

    # 与Gazebo及传感器消息使用相同的仿真时间
    use_sim_time: true
    # 目标输出频率，单位Hz
    frequency: 30.0
    sensor_timeout: 0.2

    # 小车在平面运动，约束z、roll、pitch及相关运动分量。
    two_d_mode: true
    # 由EKF发布odom到base_link的运动TF。
    publish_tf: true
    # 输出诊断信息，便于排查输入或配置问题。
    print_diagnostics: true

    # 局部定位的坐标系设置。
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    use_control: false
    # 第一组输入：带噪声的轮式里程计。
    odom0: /wheel/odometry

    # 下面15个开关的顺序固定，每3个分为一组：
    # x、y、z
    # roll、pitch、yaw
    # vx、vy、vz
    # wx、wy、wz
    # ax、ay、az
    #
    # true表示使用该分量；false表示忽略
    odom0_config: [
      false, false, false,
      false, false, false,
      true,  false, false,
      false, false, true,
      false, false, false
    ]

    odom0_queue_size: 20 # 队列最多保存的输入消息数量

    # 输入已经是速度，不需要将位置差分转换为速度
    odom0_differential: false
    odom0_relative: false

    # 第二组输入：IMU
    imu0: /imu/data

    # 只使用绕z轴角速度wz
    # 不使用姿态，也不使用加速度
    imu0_config: [
      false, false, false,
      false, false, false,
      false, false, false,
      false, false, true,
      false, false, false
    ]

    imu0_queue_size: 20
    imu0_differential: false
    imu0_relative: false

    # 当前不融合加速度，因此不进行重力去除处理
    imu0_remove_gravitational_acceleration: false